name: CI

on:
  push:
    branches: [restructuring/ci, restructuring/firmware, main]
  pull_request:
    branches: [restructuring/ci, restructuring/firmware, main]

jobs:
  contract-tests:
    name: CAN contract tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: pip install -r tests/requirements.txt
      - name: Run pytest
        working-directory: tests
        run: pytest -q

  # Builds each board against this embedded-pio commit.
  # Needs read access to private sc2-* repos (same GitHub org).
  # Set repo/org secret SC2_CI_TOKEN to a PAT with Contents: Read on those repos,
  # or enable org Actions access so github.token can read sibling private repos.
  consumer-matrix:
    name: Consumer build (${{ matrix.repo }})
    needs: contract-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo:
          - sc2-powertrain
          - sc2-pdc
          - sc2-steering-wheel
          - sc2-mppt
          - sc2-lighting
    steps:
      - name: Checkout embedded-pio under test
        uses: actions/checkout@v4
        with:
          path: embedded-pio

      - name: Checkout consumer board
        env:
          # Prefer a PAT that can read private org board repos.
          GH_TOKEN: ${{ secrets.SC2_CI_TOKEN || github.token }}
        run: |
          set -euo pipefail
          REPO="https://x-access-token:${GH_TOKEN}@github.com/badgerloop-software/${{ matrix.repo }}.git"

          # Do not --recurse-submodules: .gitmodules uses SSH URLs and Actions
          # has no deploy key. We replace embedded-pio in the next step anyway.
          clone_branch() {
            git clone --depth 1 -b "$1" "$REPO" consumer
          }

          if git ls-remote --exit-code --heads "$REPO" restructuring/firmware >/dev/null 2>&1; then
            clone_branch restructuring/firmware
          elif git ls-remote --exit-code --heads "$REPO" restructuring/ci >/dev/null 2>&1; then
            clone_branch restructuring/ci
          elif git ls-remote --exit-code --heads "$REPO" main >/dev/null 2>&1; then
            clone_branch main
          else
            echo "::error::Cannot list branches for badgerloop-software/${{ matrix.repo }}."
            echo "CI needs read access to private org repos."
            echo "Add secret SC2_CI_TOKEN (PAT with Contents: Read on sc2-* repos),"
            echo "or enable org Actions access to other private repositories."
            exit 1
          fi

      - name: Point consumer at this embedded-pio commit
        working-directory: consumer
        run: |
          rm -rf embedded-pio
          cp -a "${GITHUB_WORKSPACE}/embedded-pio" embedded-pio

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build firmware
        working-directory: consumer
        run: pio run
